<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Ink ground rather than paper: at 16px on a light browser tab a paper-white
    mark loses its edge, so the page's ink/paper relationship is inverted here.
    2px radius is the largest the editorial system uses anywhere.
  -->
  <rect width="32" height="32" rx="2" fill="#111111" />
  <text
    x="16"
    y="23.5"
    text-anchor="middle"
    font-family="Archivo, Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="600"
    letter-spacing="-0.5"
    fill="#F5F4F0"
  >A</text>
  <circle cx="26" cy="7" r="2.5" fill="#1B3BD9" />
</svg>
